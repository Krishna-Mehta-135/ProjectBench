name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://metrics:metrics-ci@localhost:5432/metrics
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: metrics
          POSTGRES_USER: metrics
          POSTGRES_PASSWORD: metrics-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metrics -d metrics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test -- --run

