name: quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://metrics:metrics-ci@localhost:5432/metrics
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: metrics
          POSTGRES_USER: metrics
          POSTGRES_PASSWORD: metrics-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metrics -d metrics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo dependencies and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify web lockfile
        run: |
          cd "$GITHUB_WORKSPACE/apps/web"
          test -s package-lock.json
      - run: |
          cd "$GITHUB_WORKSPACE/apps/web"
          pwd
          ls -l package.json package-lock.json
          npm config get package-lock
          npm ci --package-lock=true --no-audit --no-fund
      - run: |
          cd "$GITHUB_WORKSPACE/apps/web"
          npm run build
      - run: |
          cd "$GITHUB_WORKSPACE/apps/web"
          npm test -- --run

