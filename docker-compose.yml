services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metrics
      POSTGRES_USER: metrics
      POSTGRES_PASSWORD: metrics-local-only
    ports: ["5432:5432"]
    volumes: [metrics-postgres:/var/lib/postgresql/data]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://metrics:metrics-local-only@postgres:5432/metrics
    ports: ["8080:8080"]
    depends_on: [postgres]

volumes:
  metrics-postgres:

