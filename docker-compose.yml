services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metrics
      POSTGRES_USER: metrics
      POSTGRES_PASSWORD: metrics-local-only
    ports: ["127.0.0.1:${PROJECTBENCH_POSTGRES_PORT:-15432}:5432"]
    volumes: [metrics-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrics -d metrics"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://metrics:metrics-local-only@postgres:5432/metrics
      ARTIFACT_ROOT: /var/lib/metrics/artifacts
      METRICS_OPERATOR_TOKEN: ${METRICS_OPERATOR_TOKEN:-projectbench-demo-token}
      METRICS_BIND_ADDR: 0.0.0.0:8080
    ports: ["127.0.0.1:${PROJECTBENCH_API_PORT:-18080}:8080"]
    volumes: [metrics-artifacts:/var/lib/metrics/artifacts]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports: ["127.0.0.1:${PROJECTBENCH_WEB_PORT:-4174}:8080"]
    profiles: [demo]

  demo-app:
    image: projectbench-demo:local
    build:
      context: ./apps/demo
      dockerfile: Dockerfile
    cpus: 1.0
    cpuset: "0"
    mem_limit: 256m
    profiles: [demo]

  demo-runner:
    image: projectbench-demo:local
    command: ["node", "harness.mjs"]
    environment:
      API_BASE_URL: http://api:8080
      SAMPLE_URL: http://demo-app:3000/health
      METRICS_OPERATOR_TOKEN: ${METRICS_OPERATOR_TOKEN:-projectbench-demo-token}
      DEMO_IMAGE_DIGEST: ${DEMO_IMAGE_DIGEST:-}
      DEMO_COMMIT: ${DEMO_COMMIT:-local-demo}
      DEMO_HOST_CPU: ${DEMO_HOST_CPU:-unknown}
      DEMO_OS: ${DEMO_OS:-unknown}
      DEMO_DOCKER_VERSION: ${DEMO_DOCKER_VERSION:-unknown}
    cpus: 1.0
    mem_limit: 256m
    depends_on:
      - api
      - demo-app
    profiles: [demo]

volumes:
  metrics-postgres:
  metrics-artifacts:
