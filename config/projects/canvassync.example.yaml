project: canvassync
environment: azure-staging
target_origin: https://api.canvassync.tech
scenario: canvassync-room-read
version: "1"
workload:
  vus: 1
  duration_seconds: 60
  think_time_seconds: 2
  hard_runtime_seconds: 75
