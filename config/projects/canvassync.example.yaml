  email: TEST_ACCOUNT_EMAIL
  password: TEST_ACCOUNT_PASSWORD
  seeded_room_id: SEEDED_ROOM_ID
notes:
  - "Example only; credentials and room IDs are injected at runtime."
  - "Do not run against Azure until target and workload are explicitly reviewed."

