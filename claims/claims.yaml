- id: canvassync-redis-cold-start-latency
  project: canvassync
  source: resume
  source_ref: "../Career-Ops/cv.md:36"
  statement: "Cold-join latency with Redis room snapshots versus direct PostgreSQL reads."
  kind: comparative
  metric: join_sync_latency_ms
  metric_definition: "Elapsed time from WebSocket open to the joining client parsing the full room_joined state, with no in-memory room state and a warm Redis snapshot."
  direction: lower_is_better
  baseline: "same current build using the historical direct PostgreSQL read-on-join path behind an experiment flag"
  candidate: "the same current build with the Redis-backed join path enabled by the same experiment flag"
  workloads: [cold-start-100-shapes, cold-start-1000-shapes, cold-start-5000-shapes]
  repetitions: 30
  target_percent: 60
  tolerance_percent: 5
  reproduce_command: "make bench-w4-up && make bench-w4"
  status: measuring
  verification: "At 76a5fe0^, a cold join performed one Postgres shape.findMany and returned room_joined; there was no polling loop. W4 measured that direct-read baseline against a warm Redis snapshot in the same current build. W5 classified the 100-, 1,000-, and 5,000-shape workloads as inconclusive because their ranges did not separate the medians. No 60% latency reduction is supported. Raw result files must be restored and reviewed before publication."

